[project]
name = "crier"
version = "0.1.0"
description = "Zulip digest for the Recurse Center, summarized by RC's own LLM or a local one"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.scripts]
crier = "crier.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crier"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
